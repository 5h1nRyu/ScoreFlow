name: Layout regression
on:
  push:
    branches: [dev_v6, dev_v7]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/month-data.test.cjs
      - run: node --test tests/layout.test.cjs
      - run: node --test --test-name-pattern="metadata works|HeroShow|monthly selection|newly configured|missing all close-ups|4K and DPR 3|required data failures|simplified NASA-punk|ranking rows fill|16:9 layout fits|progress is centered|opening keeps|bottom decorative pin" tests/protocol.test.cjs
