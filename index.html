<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="队伍随 game 进度变化的动态积分折线图" />
    <title>队伍积分走势</title>
    <script src="src/config/config.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main id="dashboard" class="dashboard">
      <header class="dashboard__title" aria-label="主标题区"></header>
      <section class="dashboard__chart-area" aria-label="图表区">
        <section class="dashboard__region" aria-label="积分走势区域">
          <canvas id="scoreChart" role="img" aria-label="各队伍随 game 进度连续变化的积分折线图"></canvas>
        </section>
        <div class="dashboard__middle-decoration" aria-hidden="true"></div>
        <section class="dashboard__region" aria-label="比赛详情区域">
          <div id="tableStage" class="table-stage">
            <section id="gameTable" class="game-table" aria-label="当前两个 game 的比赛详情"></section>
            <section id="teamTableSlot" class="team-table-slot" aria-label="队伍总览" hidden></section>
          </div>
        </section>
      </section>
      <footer class="dashboard__footer-decoration" aria-label="底部装饰区"></footer>
    </main>
    <p id="dataError" role="alert" hidden></p>
    <script src="src/data/team-data.js"></script>
    <script src="src/data/game-data.js"></script>
    <script src="src/core/timeline.js"></script>
    <script src="src/components/score-chart.js"></script>
    <script src="src/components/game-table.js"></script>
    <script src="src/components/team-table.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
